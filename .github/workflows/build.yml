name: "Build and Upload Sysroots"

on:
  push:
    paths:
      - build/linux/sysroot_scripts/**
      - .github/workflows/build.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    strategy:
      matrix:
        arch: [amd64, i386, armhf, arm64, mipsel, mips64el, ppc64el, riscv64]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Packages
        run: |
          sudo apt update
          sudo apt install -y \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            binutils-arm-linux-gnueabihf \
            binutils-mips64el-linux-gnuabi64 \
            binutils-mipsel-linux-gnu \
            binutils-powerpc64le-linux-gnu \
            binutils-riscv64-linux-gnu
      - name: Install dependencies
        run: python3 -m pip install --upgrade requests
      - name: Build Sysroot
        run: ./build/linux/sysroot_scripts/sysroot_creator.py build ${{ matrix.arch }}
      - name: Upload Sysroot Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.arch == 'riscv64' && 'debian_trixie_' || 'debian_bullseye_' }}${{ matrix.arch }}_sysroot.tar.xz
          path: ${{ matrix.arch == 'riscv64' && 'out/sysroot-build/trixie/debian_trixie_' || 'out/sysroot-build/bullseye/debian_bullseye_' }}${{ matrix.arch }}_sysroot.tar.xz
  upload:
    name: Upload Sysroots to Azure
    runs-on: ubuntu-latest
    needs: build
    environment: production
    if: github.ref == 'refs/heads/bullseye'
    env:
      AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Azure login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_OIDC_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_OIDC_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_OIDC_SUBSCRIPTION_ID }}
      - name: Install dependencies
        run: python3 -m pip install --upgrade requests
      - name: Download Bullseye Sysroot Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "debian_bullseye_*_sysroot.tar.xz"
          path: out/sysroot-build/bullseye
          merge-multiple: true
      - name: Download Trixie Sysroot Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "debian_trixie_*_sysroot.tar.xz"
          path: out/sysroot-build/trixie
          merge-multiple: true
      - name: Download sysroots.json from Electron
        run: |
          json_url="https://raw.githubusercontent.com/electron/electron/main/script/sysroots.json"
          curl --output build/linux/sysroot_scripts/sysroots.json $json_url -H "Accept: application/json"
      - name: Upload Sysroots to Azure
        run: ./build/linux/sysroot_scripts/build_and_upload.py --upload
      - name: Upload Sysroot JSON Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sysroots.json
          path: build/linux/sysroot_scripts/sysroots.json
